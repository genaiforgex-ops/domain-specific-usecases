nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
affinity: {}
tolerations: []

serviceAccount:
  create: true
  name: "genaiforge-marketing"
  annotations: {}
  automountServiceAccountToken: false

backend:
  replicaCount: 1
  image:
    repository: example.registry.local/genaiforge/marketing-backend
    pullPolicy: Always
    tag: latest
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

frontend:
  replicaCount: 1
  image:
    repository: example.registry.local/genaiforge/marketing-frontend
    pullPolicy: Always
    tag: latest
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

cloudsqlproxy:
  enabled: false
  image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0"
  instanceConnectionName: "YOUR_PROJECT:REGION:gf-db"
  port: 5432
  args:
    - "--structured-logs"
    - "--private-ip"
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "50m"
      memory: "64Mi"

podEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: gf-secret
        key: DATABASE_URL
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: gf-secret
        key: JWT_SECRET
  - name: GEMINI_API_KEY
    valueFrom:
      secretKeyRef:
        name: gf-secret
        key: GEMINI_API_KEY
  - name: CORS_ORIGINS
    valueFrom:
      secretKeyRef:
        name: gf-secret
        key: CORS_ORIGINS

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  host: marketing.genaiforge.in
  tls:
    secretName: genaiforge-marketing-tls

virtualservice:
  enabled: false
  host: ""
  gateway: "istio-system/default-internal-gateway"
  backendPort: 8000
  frontendPort: 80
  apiPrefix: /api
  prefix: /
  timeout: 600s
  perTryTimeout: 120s

sync:
  secrets:
    enabled: false
    project_id: ""
    secrets: []
