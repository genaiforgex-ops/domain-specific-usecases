backend:
  replicaCount: 1
  deploymentStrategy: RollingUpdate
  image:
    repository: example.registry.local/genaiforge/marketing-backend-uat
    pullPolicy: Always
  autoscaling:
    enabled: false

frontend:
  replicaCount: 1
  image:
    repository: example.registry.local/genaiforge/marketing-frontend-uat
    pullPolicy: Always
  autoscaling:
    enabled: false

serviceAccount:
  create: true
  name: "genaiforge-marketing"
  annotations: {}
  automountServiceAccountToken: false

cloudsqlproxy:
  enabled: false
  instanceConnectionName: "YOUR_PROJECT:REGION:gf-db-uat"

podEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: gf-secret
        key: DATABASE_URL
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: gf-secret
        key: JWT_SECRET
  - name: GEMINI_API_KEY
    valueFrom:
      secretKeyRef:
        name: gf-secret
        key: GEMINI_API_KEY
  - name: CORS_ORIGINS
    valueFrom:
      secretKeyRef:
        name: gf-secret
        key: CORS_ORIGINS
  - name: SEED_ON_STARTUP
    value: "true"
  - name: ENVIRONMENT
    value: "uat"
  - name: PUBLIC_BASE_URL
    value: "https://marketing-uat.genaiforge.in"
  - name: EMAIL_FROM_NAME
    value: "GenAIForge Marketing"
  - name: EMAIL_APP_BASE_URL
    value: "https://marketing-uat.genaiforge.in"
  - name: EMAIL_API_BASE_URL
    value: "https://marketing-uat.genaiforge.in"
  - name: FIGMA_REDIRECT_URI
    value: "https://marketing-uat.genaiforge.in/api/figma/callback"
  - name: FIGMA_POST_LOGIN_REDIRECT
    value: "https://marketing-uat.genaiforge.in"

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
  host: marketing-uat.genaiforge.in
  tls:
    secretName: genaiforge-marketing-tls

virtualservice:
  enabled: false

sync:
  secrets:
    enabled: false
