backend:
  replicaCount: 1
  deploymentStrategy: RollingUpdate
  image:
    repository: example.registry.local/genaiforge/marketing-backend-dev
    pullPolicy: Always
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

frontend:
  replicaCount: 1
  image:
    repository: example.registry.local/genaiforge/marketing-frontend-dev
    pullPolicy: Always
  autoscaling:
    enabled: false
  service:
    type: ClusterIP
    port: 80

serviceAccount:
  create: true
  name: "genaiforge-marketing"
  annotations: {}
  automountServiceAccountToken: false

cloudsqlproxy:
  enabled: false
  image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0"
  instanceConnectionName: "YOUR_PROJECT:REGION:gf-db-dev"
  port: 5432
  args:
    - "--structured-logs"
    - "--private-ip"

podEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: gf-secret
        key: DATABASE_URL
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: gf-secret
        key: JWT_SECRET
  - name: GEMINI_API_KEY
    valueFrom:
      secretKeyRef:
        name: gf-secret
        key: GEMINI_API_KEY
  - name: CORS_ORIGINS
    valueFrom:
      secretKeyRef:
        name: gf-secret
        key: CORS_ORIGINS
  - name: SEED_ON_STARTUP
    value: "true"
  - name: ENVIRONMENT
    value: "dev"
  - name: PUBLIC_BASE_URL
    value: "https://marketing-dev.genaiforge.in"
  - name: EMAIL_ENABLED
    value: "true"
  - name: EMAIL_FROM_NAME
    value: "GenAIForge Marketing"
  - name: EMAIL_APP_BASE_URL
    value: "https://marketing-dev.genaiforge.in"
  - name: EMAIL_API_BASE_URL
    value: "https://marketing-dev.genaiforge.in"
  - name: FIGMA_REDIRECT_URI
    value: "https://marketing-dev.genaiforge.in/api/figma/callback"
  - name: FIGMA_POST_LOGIN_REDIRECT
    value: "https://marketing-dev.genaiforge.in"

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  host: marketing-dev.genaiforge.in
  tls:
    secretName: genaiforge-marketing-tls

virtualservice:
  enabled: false

sync:
  secrets:
    enabled: false
