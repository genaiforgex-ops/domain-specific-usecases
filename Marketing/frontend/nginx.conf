server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend service.
    # In Kubernetes the ingress routes /api directly to the backend service,
    # so this block is only exercised in docker-compose environments.
    #
    # The upstream is a variable (not a literal host) on purpose: with a literal
    # `proxy_pass http://backend:8000`, nginx resolves "backend" at startup and
    # crashes where that host doesn't exist (e.g. in-cluster, where the service
    # is named amp-backend). Using a variable + resolver defers DNS to request
    # time, so nginx boots everywhere and only resolves "backend" when a request
    # actually reaches this block — which happens only under docker-compose.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA routing: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
