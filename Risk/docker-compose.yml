services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: genaiforge
      POSTGRES_PASSWORD: genaiforge
      POSTGRES_DB: genaiforge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genaiforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://genaiforge:genaiforge@postgres:5432/genaiforge
      DATABASE_URL_SYNC: postgresql://genaiforge:genaiforge@postgres:5432/genaiforge
      STORAGE_ADAPTER: local
      LOCAL_STORAGE_PATH: /var/genaiforge-documents
      PUBLIC_BASE_URL: http://localhost:8002
      FRONTEND_BASE_URL: http://localhost:5174
      CORS_ORIGINS: http://localhost:5174
      ENVIRONMENT: local
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - genaiforge_docs:/var/genaiforge-documents
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: ""
      VITE_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5174
    depends_on:
      - api

volumes:
  postgres_data:
  genaiforge_docs:
