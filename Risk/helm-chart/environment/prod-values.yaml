backend:
  replicaCount: 2
  image:
    repository: genaiforge/local
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 75
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

frontend:
  replicaCount: 2
  image:
    repository: genaiforge/local
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: "genaiforge"
  annotations:
    iam.gke.io/gcp-service-account: gke-cloudsql-sa@genaiforge.iam.gserviceaccount.com
  automountServiceAccountToken: false

cloudsqlproxy:
  enabled: true
  image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0"
  instanceConnectionName: "genaiforge:asia-south1:genaiforge-db-prod"
  port: 5432
  args:
    - "--structured-logs"
    - "--private-ip"

podEnv:
  # Selects the deployment environment and the object-storage folder segment.
  - name: ENVIRONMENT
    value: "prod"
  # Uploaded classification documents -> GCS (auth via Workload Identity SA).
  - name: STORAGE_ADAPTER
    value: "gcs"
  - name: GCS_BUCKET
    value: "genaiforge"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: genaiforge-secret
        key: DATABASE_URL
  - name: DATABASE_URL_SYNC
    valueFrom:
      secretKeyRef:
        name: genaiforge-secret
        key: DATABASE_URL_SYNC
  # Origin used to build the absolute form link in outbound email.
  # FRONTEND_BASE_URL is blank here, so this is the fallback the link is built
  # from — without it the email would carry a bare /my-forms/... path that cannot
  # be opened. Matches the virtualservice host below.
  - name: PUBLIC_BASE_URL
    value: "https://genaiforge.genaiforge.local"
  # Email (Google Workspace SMTP), used by the form assign/reminder flow.
  # SMTP_FROM must equal SMTP_USERNAME or be a verified alias of it, or Gmail
  # rewrites the From header.
  # SMTP_PASSWORD is deliberately NOT mirrored into genaiforge-secret: it is a Google
  # NOTE: outbound TCP 587 must be permitted from the cluster. If it is not,
  # every send fails with a connection timeout while the code looks correct.
  # NOTE: the virtualservice uses an internal gateway; confirm egress policy here
  # before assuming a failure is a code problem.
  - name: EMAIL_ADAPTER
    value: "smtp"
  - name: SMTP_HOST
    value: "smtp.gmail.com"
  - name: SMTP_PORT
    value: "587"
  - name: SMTP_FROM
    value: "noreply@genaiforge.local"
  - name: SMTP_USERNAME
    value: "noreply@genaiforge.local"

ingress:
  enabled: false

virtualservice:
  enabled: true
  host: "genaiforge.genaiforge.local"
  gateway: "istio-system/default-internal-gateway"
  backendPort: 8000
  frontendPort: 80
  apiPrefix: /api
  prefix: /
  timeout: 600s
  perTryTimeout: 120s

sync:
  secrets:
    enabled: false
