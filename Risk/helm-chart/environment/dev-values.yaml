backend:
  replicaCount: 1
  image:
    repository: genaiforge/local
    pullPolicy: Always
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

frontend:
  replicaCount: 1
  image:
    repository: genaiforge/local
    pullPolicy: Always
  autoscaling:
    enabled: false

serviceAccount:
  create: true
  name: "genaiforge"
  annotations:
    iam.gke.io/gcp-service-account: gke-cloudsql-sa@genaiforge.iam.gserviceaccount.com
  automountServiceAccountToken: false

cloudsqlproxy:
  enabled: true
  image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0"
  instanceConnectionName: "genaiforge:asia-south1:finance-db-dev"
  port: 5432
  args:
    - "--structured-logs"
    - "--private-ip"

podEnv:
  - name: AI_ADAPTER
    value: "gemini"
  # Selects the deployment environment and the object-storage folder segment.
  - name: ENVIRONMENT
    value: "dev"
  # Uploaded classification documents -> GCS (auth via Workload Identity SA).
  - name: STORAGE_ADAPTER
    value: "gcs"
  - name: GCS_BUCKET
    value: "genaiforge"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: genaiforge-secret
        key: DATABASE_URL
  - name: CORS_ORIGINS
    valueFrom:
      secretKeyRef:
        name: genaiforge-secret
        key: CORS_ORIGINS
  - name: VITE_API_URL
    valueFrom:
      secretKeyRef:
        name: genaiforge-secret
        key: VITE_API_URL
  - name: GEMINI_API_KEY
    valueFrom:
      secretKeyRef:
        name: genaiforge-secret
        key: GEMINI_API_KEY
  # are shared across JFS apps and the backend reads them straight from Secret
  # Manager at startup (same path GEMINI_API_KEY uses), so mirroring them into
  # genaiforge-secret would just create a second copy to keep in sync.
  # Stated explicitly for ops visibility, though it matches what the backend
  # would derive anyway. Local dev uses a different client (genaiforge-dev-local)
  # because the two have different registered redirect URIs.
  # The OAuth redirect_uri is built from this. It must be the public https
  # origin: uvicorn runs without --proxy-headers, so request.base_url reports
  - name: PUBLIC_BASE_URL
    value: "https://genaiforge-dev.genaiforge.local"
  # Email (Google Workspace SMTP), used by the form assign/reminder flow.
  # SMTP_FROM must equal SMTP_USERNAME or be a verified alias of it, or Gmail
  # rewrites the From header.
  # SMTP_PASSWORD is deliberately NOT mirrored into genaiforge-secret: it is a Google
  # NOTE: outbound TCP 587 must be permitted from the cluster. If it is not,
  # every send fails with a connection timeout while the code looks correct.
  - name: EMAIL_ADAPTER
    value: "smtp"
  - name: SMTP_HOST
    value: "smtp.gmail.com"
  - name: SMTP_PORT
    value: "587"
  - name: SMTP_FROM
    value: "noreply@genaiforge.local"
  - name: SMTP_USERNAME
    value: "noreply@genaiforge.local"

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  host: genaiforge-dev.genaiforge.local
  tls:
    secretName: genaiforge-tls

virtualservice:
  enabled: false

sync:
  secrets:
    enabled: false
