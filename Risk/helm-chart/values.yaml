nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
affinity: {}
tolerations: []

serviceAccount:
  create: true
  name: "genaiforge"
  annotations:
    iam.gke.io/gcp-service-account: gke-cloudsql-sa@genaiforge.iam.gserviceaccount.com
  automountServiceAccountToken: false

backend:
  replicaCount: 1
  image:
    repository: genaiforge/local
    pullPolicy: Always
    tag: latest
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

frontend:
  replicaCount: 1
  image:
    repository: genaiforge/local
    pullPolicy: Always
    tag: latest
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

cloudsqlproxy:
  enabled: true
  image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0"
  instanceConnectionName: ""
  port: 5432
  args:
    - "--structured-logs"
    - "--private-ip"
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "50m"
      memory: "64Mi"

podEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: genaiforge-secret
        key: DATABASE_URL
  - name: DATABASE_URL_SYNC
    valueFrom:
      secretKeyRef:
        name: genaiforge-secret
        key: DATABASE_URL_SYNC
  # Object storage for uploaded classification documents. Auth is via the
  # Workload-Identity service account (serviceAccount above) — grant it
  # roles/storage.objectAdmin on the bucket; no keys needed.
  - name: STORAGE_ADAPTER
    value: "gcs"
  - name: GCS_BUCKET
    value: "genaiforge"

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  host: genaiforge.genaiforge.local
  tls:
    secretName: genaiforge-genaiforge-in-tls

virtualservice:
  enabled: false
  host: ""
  gateway: "istio-system/default-internal-gateway"
  backendPort: 8000
  frontendPort: 80
  apiPrefix: /api
  prefix: /
  timeout: 600s
  perTryTimeout: 120s

sync:
  secrets:
    enabled: false
    project_id: ""
    secrets: []
