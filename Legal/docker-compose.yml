services:
  onlyoffice:
    image: onlyoffice/documentserver:8.3
    container_name: legalos-onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-onlyoffice-dev-secret-change-me}
      JWT_HEADER: Authorization
    volumes:
      - ./docker/onlyoffice/local-production-linux.json:/etc/onlyoffice/documentserver/local-production-linux.json
    ports:
      - "8082:80"

  backend:
    build:
      context: ./backend
    container_name: legalos-backend
    # Reach Postgres / Cloud SQL Auth Proxy on the Mac host.
    # Do NOT set custom dns: here — it bypasses Docker's resolver and breaks
    # host.docker.internal (alembic then fails with "Name or service not known").
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Google Cloud SQL (PostgreSQL) — DB: legalos-uat.
      # Supply the full connection string via .env (DATABASE_URL).
      # When running outside GCP, connect through the Cloud SQL Auth Proxy.
      # IMPORTANT: inside Docker, 127.0.0.1 points at the container itself.
      # Use host.docker.internal to reach your *host* Postgres.
      DATABASE_URL: ${DATABASE_URL_DOCKER:-${DATABASE_URL}}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-this-is-a-dev-secret-only}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      AI_BACKEND: ${AI_BACKEND:-stub}
      MODEL_VERSION: ${MODEL_VERSION:-legalos-stub-0.1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Secret Manager — per-env app secret (legalos_dev / legalos_uat / legalos_prod).
      # Set LEGALOS_ENV; override with GCP_SECRET_NAME if needed.
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-agentic-ai-476106}
      LEGALOS_ENV: ${LEGALOS_ENV:-dev}
      GCP_SECRET_NAME: ${GCP_SECRET_NAME:-}
      GCP_SERVICE_ACCOUNT_FILE: /secrets/service_account_agentic_uat.json
      ADK_MODEL: ${ADK_MODEL:-gemini-2.5-flash}
      ADK_LITELLM_API_BASE: ${ADK_LITELLM_API_BASE:-}
      ADK_LITELLM_API_KEY: ${ADK_LITELLM_API_KEY:-}
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      # GCS — templates/executed library + durable MSA live docs (not /tmp).
      LEGAL_TEMPLATES_BUCKET: ${LEGAL_TEMPLATES_BUCKET:-legalos}
      LEGAL_TEMPLATES_PREFIX: ${LEGAL_TEMPLATES_PREFIX:-legal_templates}
      LEGAL_CONTRACTS_PREFIX: ${LEGAL_CONTRACTS_PREFIX:-contracts}
      DOCUMENT_STORAGE_BACKEND: ${DOCUMENT_STORAGE_BACKEND:-gcs}
      MSA_DOCUMENTS_PREFIX: ${MSA_DOCUMENTS_PREFIX:-legal_live_docs}
      LOCAL_STORAGE_PATH: /tmp/legalos-storage
      ONLYOFFICE_ENABLED: "true"
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-onlyoffice-dev-secret-change-me}
      ONLYOFFICE_PUBLIC_URL: http://localhost:8082
      ONLYOFFICE_DOCUMENT_BASE_URL: http://backend:8000
      ONLYOFFICE_CALLBACK_BASE_URL: http://backend:8000
      ONLYOFFICE_COMMAND_BASE_URL: http://onlyoffice
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:8000/api/gmail/oauth/callback}
      GMAIL_ENABLED: ${GMAIL_ENABLED:-false}
      GMAIL_POLL_INTERVAL_SECONDS: ${GMAIL_POLL_INTERVAL_SECONDS:-120}
      GMAIL_LABEL: ${GMAIL_LABEL:-LegalOS/MSA}
      # Email notifications (SMTP). Simplest path: set SMTP_USERNAME + SMTP_PASSWORD
      # in .env (env overrides Secret Manager). To use Secret Manager instead,
      # leave them blank and provide GCP creds + the named secrets below.
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-LegalOS Notifications}
      SMTP_USERNAME_SECRET_NAME: ${SMTP_USERNAME_SECRET_NAME:-brand_uat_EMAIL_SMTP_USERNAME}
      SMTP_PASSWORD_SECRET_NAME: ${SMTP_PASSWORD_SECRET_NAME:-brand_uat_EMAIL_SMTP_PASSWORD}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-password123}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Mount the SA key OUTSIDE /app so it never collides with the ./backend:/app
      # bind-mount (which may itself contain a stale service_account_* path).
      - ./service_account_agentic_uat.json:/secrets/service_account_agentic_uat.json:ro
      - legalos_storage:/tmp/legalos-storage

  frontend:
    build:
      context: ./frontend
      # Same-origin: nginx in the image proxies /api to the backend service.
      # (VITE_API_BASE_URL is a build-time value, not a runtime env var.)
    container_name: legalos-frontend
    depends_on:
      - backend
      - onlyoffice
    ports:
      - "5173:80"

volumes:
  legalos_storage:
