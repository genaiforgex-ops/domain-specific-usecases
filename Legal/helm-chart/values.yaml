nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
affinity: {}
tolerations: []

serviceAccount:
  create: true
  name: "legalos"
  annotations:
    iam.gke.io/gcp-service-account: gke-cloudsql-sa@agentic-ai-476106.iam.gserviceaccount.com
  automountServiceAccountToken: false

backend:
  replicaCount: 1
  image:
    repository: asia-south1-docker.pkg.dev/agentic-ai-476106/jfs/legalos-backend
    pullPolicy: Always
    tag: latest
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

frontend:
  replicaCount: 1
  image:
    repository: asia-south1-docker.pkg.dev/agentic-ai-476106/jfs/legalos-frontend
    pullPolicy: Always
    tag: latest
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

cloudsqlproxy:
  enabled: true
  image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0"
  instanceConnectionName: ""
  port: 5432
  args:
    - "--structured-logs"
    - "--private-ip"
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "50m"
      memory: "64Mi"

podEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: DATABASE_URL
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: JWT_SECRET
  - name: CORS_ORIGINS
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: CORS_ORIGINS
  - name: GEMINI_API_KEY
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: GEMINI_API_KEY
  - name: AI_BACKEND
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: AI_BACKEND
  - name: GMAIL_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: GMAIL_CLIENT_ID
  - name: GMAIL_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: GMAIL_CLIENT_SECRET
  - name: GMAIL_REDIRECT_URI
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: GMAIL_REDIRECT_URI

storage:
  enabled: false
  storageClassName: standard-rwo
  size: 10Gi
  mountPath: /tmp/legalos-storage

onlyoffice:
  enabled: false
  host: ""
  image:
    repository: onlyoffice/documentserver
    tag: "8.3"
  jwt:
    existingSecret: onlyoffice-jwt
    existingSecretKey: secret
  ingress:
    enabled: false
    sslRedirect: "false"
    tlsSecretName: ""
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  backend:
    publicUrl: ""
    documentBaseUrl: ""
    callbackBaseUrl: ""
    commandBaseUrl: ""

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  host: legalos.jiofinance.in
  tls:
    secretName: legalos-jiofinance-in-tls

virtualservice:
  enabled: false
  host: ""
  gateway: "istio-system/default-internal-gateway"
  backendPort: 8000
  frontendPort: 80
  apiPrefix: /api
  prefix: /
  timeout: 600s
  perTryTimeout: 120s

sync:
  secrets:
    enabled: false
    project_id: ""
    secrets: []
