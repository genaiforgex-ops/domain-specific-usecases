backend:
  replicaCount: 2
  image:
    repository: asia-south1-docker.pkg.dev/prod-agentic-ai/jfs/legalos-backend
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 75
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

frontend:
  replicaCount: 2
  image:
    repository: asia-south1-docker.pkg.dev/prod-agentic-ai/jfs/legalos-frontend
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: "legalos"
  annotations:
    iam.gke.io/gcp-service-account: gke-cloudsql-sa@prod-agentic-ai.iam.gserviceaccount.com
  automountServiceAccountToken: false

cloudsqlproxy:
  enabled: true
  image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0"
  instanceConnectionName: "prod-agentic-ai:asia-south1:legalos-db-prod"
  port: 5432
  args:
    - "--structured-logs"
    - "--private-ip"

podEnv:
  - name: LEGALOS_ENV
    value: "prod"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: DATABASE_URL
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: JWT_SECRET
  - name: CORS_ORIGINS
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: CORS_ORIGINS
  - name: GEMINI_API_KEY
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: GEMINI_API_KEY
  - name: AI_BACKEND
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: AI_BACKEND
  - name: GMAIL_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: GMAIL_CLIENT_ID
  - name: GMAIL_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: GMAIL_CLIENT_SECRET
  - name: GMAIL_REDIRECT_URI
    valueFrom:
      secretKeyRef:
        name: legalos-secret
        key: GMAIL_REDIRECT_URI

ingress:
  enabled: false

virtualservice:
  enabled: true
  host: "legalos.jiofinance.in"
  gateway: "istio-system/default-internal-gateway"
  backendPort: 8000
  frontendPort: 80
  apiPrefix: /api
  prefix: /
  timeout: 600s
  perTryTimeout: 120s

sync:
  secrets:
    enabled: false
