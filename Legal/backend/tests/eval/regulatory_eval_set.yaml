# Clause-level ground truth for regulatory retrieval.
#
# Each case names the question a lawyer would ask and the provision that MUST be
# retrieved to answer it. `expect_section` is a regex matched against the retrieved
# chunk's section_label, so "Para 5\\.3" passes whether the chunker emitted
# "Para 5.3" or "Para 5.3 (1/2)".
#
# `must_not_cite` lists doc_ids that would indicate stale law was served.
#
# Add a case whenever someone reports a wrong or vague answer: that is how a
# complaint becomes a regression test. Cases whose doc_id is not ingested are
# reported as SKIPPED rather than failed, so this file can describe the whole
# target corpus while it is still being loaded.

- question: what is the cooling-off period for a digital loan
  doc_id: LEND-DLD-2025
  expect_section: 'Para 5\.3'
  tags: [cooling-off]

- question: how many days cooling-off applies to a loan with a tenor of seven days or more
  doc_id: LEND-DLD-2025
  expect_section: 'Para 5\.3'
  tags: [cooling-off]

- question: must a Key Fact Statement be given to the borrower before the contract is executed
  doc_id: LEND-DLD-2025
  expect_section: 'Para 5\.1'
  tags: [kfs]

- question: what must the KFS disclose about the annual percentage rate
  doc_id: LEND-DLD-2025
  expect_section: 'Para 5\.(1|2)'
  tags: [kfs, apr]

- question: can loan disbursals be routed through a lending service provider account
  doc_id: LEND-DLD-2025
  expect_section: 'Para 6\.1'
  tags: [disbursal, lsp]

- question: in what language must the key fact statement be written
  doc_id: LEND-DLD-2025
  expect_section: 'Para 5\.2'
  tags: [kfs]

